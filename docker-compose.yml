services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # ── Overrides for Docker context (take precedence over .env) ──
      - APP_KEY=${APP_KEY}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://site.doctrack.systems}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-doc_archive}
      - DB_USERNAME=${DB_USERNAME:-docarchive}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://100.113.183.2:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage/app
    networks:
      - internal
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-doc_archive}
      MYSQL_USER: ${DB_USERNAME:-docarchive}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
  storage:

networks:
  internal:
    driver: bridge
